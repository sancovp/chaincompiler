[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "corcc"
version = "0.3.1"
description = "Chain-of-Reasoning Compiler-Compiler — spoken reasoning + persona-melt gauge"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["chaincompiler-accc==0.3.1", "chaincompiler==0.3.1", "honeyc==0.3.1", "rulecatcher==0.3.1", "click"]

[project.scripts]
corcc = "corcc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
