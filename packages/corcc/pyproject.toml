[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corcc"
version = "0.3.0"
description = "Chain-of-Reasoning Compiler-Compiler — spoken reasoning + persona-melt gauge"
requires-python = ">=3.11"
dependencies = ["chaincompiler-accc==0.3.0", "chaincompiler==0.3.0", "honeyc==0.3.0", "rulecatcher==0.3.0", "click"]

[project.scripts]
corcc = "corcc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
