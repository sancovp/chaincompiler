[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chaincompiler-accc"
version = "0.3.4"
description = "Attention-Chain Compiler-Compiler — the atom of the cognition-chain stack"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["chaincompiler==0.3.4", "honeyc==0.3.4", "rulecatcher==0.3.4", "click"]

[project.scripts]
accc = "accc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
