[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personapack"
version = "0.1.0"
description = "A library of pre-bound PersonaBundles (description blocks + attention chains + ≥1 CoR) ready to seat into make_gba(**seat(name))"
requires-python = ">=3.11"
dependencies = ["personacc", "corcc"]

[tool.setuptools.packages.find]
where = ["src"]
