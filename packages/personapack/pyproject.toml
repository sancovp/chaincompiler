[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personapack"
version = "0.3.1"
description = "A library of pre-bound PersonaBundles (description blocks + attention chains + ≥1 CoR) ready to seat into make_gba(**seat(name))"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["personacc==0.3.1", "corcc==0.3.1"]

[tool.setuptools.packages.find]
where = ["src"]
