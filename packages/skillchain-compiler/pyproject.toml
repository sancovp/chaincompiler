[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skillchain-compiler"
version = "0.3.3"
description = "Compose Claude Code skills into a validated, packaged chain"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
skillchain = "skillchain:main"

[tool.setuptools]
py-modules = ["skillchain"]
