[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphsteer"
version = "0.3.1"
description = "Dual-regime retrieval steering via compiled in-band glyph annotations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["click", "numpy"]

[project.optional-dependencies]
# the light local ONNX backend (no torch); the container uses the same runtime
dense = ["fastembed"]
# the heavy local backend (pulls torch) — only if you want sentence-transformers
st = ["sentence-transformers"]
# build the embedding sidecar locally (normally you just `docker compose up`)
serve = ["fastapi", "uvicorn", "fastembed"]
# syntax gating: the grammar imports ChainCompiler's lint/gate engine (`chaincompiler.bridge`) and rulecatcher's
# store inside its functions, so the extra brings both
grammar = ["rulecatcher==0.3.1", "chaincompiler==0.3.1"]

[project.scripts]
glyphsteer = "glyphsteer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
