[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaincompiler-si"
version = "0.3.0"
description = "Self-Interpreter for the ChainCompiler chain dialect — an MCP that is also a skill"
requires-python = ">=3.11"
dependencies = ["chaincompiler==0.3.0", "chainaios==0.3.0", "chaincompiler-accc==0.3.0", "corcc==0.3.0", "sccc==0.3.0", "agent-skilltree>=0.4.0", "fastmcp"]

[project.scripts]
si-server = "si.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
si = ["skill/SKILL.md"]
