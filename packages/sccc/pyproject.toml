[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sccc"
version = "0.3.2"
description = "Skillchain Compiler-Compiler — chains ACs + CoRs + skills into one SKILL.md"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["chaincompiler-accc==0.3.2", "corcc==0.3.2", "chaincompiler==0.3.2", "rulecatcher==0.3.2", "skillchain-compiler==0.3.2", "click"]

[project.scripts]
sccc = "sccc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
