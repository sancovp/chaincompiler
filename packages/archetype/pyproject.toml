[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chaincompiler-archetype"
version = "0.3.2"
description = "The Archetype Compiler — archetype as state machine (Persona/Shadow/Self/Odyssey/Becoming), compiled to the one type"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["chaincompiler==0.3.2", "click"]

[project.scripts]
archetype = "archetype.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
